name: Build ChargeFlow APK

on:
  push:
    branches: [ main ]
    paths:
      - 'ChargeAnimPro.zip'
      - '.github/workflows/build-from-zip.yml'
      - '.github/patches/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract project
        run: |
          rm -rf ChargeAnimPro
          unzip -q ChargeAnimPro.zip
          test -f ChargeAnimPro/settings.gradle
          test -f ChargeAnimPro/app/src/main/AndroidManifest.xml
      - name: Merge ChargeFlow Vibes theme catalog
        working-directory: ChargeAnimPro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/chargeanim/pro/ui/theme/ChargeFlowThemes.kt")
          s = p.read_text()
          old_enum = '''    NATURE("Nature"), MINIMAL("Minimal"), ANIME("Anime"), ABSTRACT("Abstract")
}'''
          new_enum = '''    NATURE("Nature"), MINIMAL("Minimal"), ANIME("Anime"), ABSTRACT("Abstract"),
    MIDNIGHT_GARDEN("Midnight Garden"), CELESTIAL_SPARKLE("Celestial Sparkle"),
    ENCHANTED_FOREST("Enchanted Forest"), OCEAN_ABYSS("Ocean Abyss")
}'''
          if old_enum in s and "MIDNIGHT_GARDEN" not in s:
              s = s.replace(old_enum, new_enum, 1)
          old_catalog = '''    ThemeId.ABSTRACT to ThemeStyle(Color(0xFFFF6FD8), Color(0xFF6FE0FF), RendererKind.RIBBON_WAVE)
)'''
          new_catalog = '''    ThemeId.ABSTRACT to ThemeStyle(Color(0xFFFF6FD8), Color(0xFF6FE0FF), RendererKind.RIBBON_WAVE),

    // Soft Vibes presets reuse the existing lightweight renderers with dedicated palettes.
    ThemeId.MIDNIGHT_GARDEN to ThemeStyle(
        Color(0xFFB86BFF), Color(0xFFFF77C8), RendererKind.PARTICLE_FIELD, ParticleDrift.DRIFT
    ),
    ThemeId.CELESTIAL_SPARKLE to ThemeStyle(
        Color(0xFF9B8CFF), Color(0xFF65D9FF), RendererKind.PARTICLE_FIELD, ParticleDrift.RADIAL
    ),
    ThemeId.ENCHANTED_FOREST to ThemeStyle(
        Color(0xFF64E89A), Color(0xFFB8FF70), RendererKind.PARTICLE_FIELD, ParticleDrift.DRIFT
    ),
    ThemeId.OCEAN_ABYSS to ThemeStyle(
        Color(0xFF28C8FF), Color(0xFF63FFE0), RendererKind.LIQUID_RIPPLE
    )
)'''
          if old_catalog in s and "ThemeId.MIDNIGHT_GARDEN to" not in s:
              s = s.replace(old_catalog, new_catalog, 1)
          s = s.replace("import androidx.compose.runtime.setValue\\n", "").replace("import androidx.compose.runtime.getValue\\n", "")
          p.write_text(s)
          PY

      - name: Apply Cyberpunk typography
        working-directory: ChargeAnimPro
        run: |
          mkdir -p app/src/main/res/font
          cp ../.github/patches/cyberpunk_font.xml app/src/main/res/font/cyberpunk_font.xml
          cat > app/src/main/res/font/cyberpunk_sans.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <font-family xmlns:android="http://schemas.android.com/apk/res/android">
              <font android:fontStyle="normal" android:fontWeight="400" android:font="@font/cyberpunk_sans_fallback" />
          </font-family>
          EOF
      - name: Apply Cyberpunk color palette
        working-directory: ChargeAnimPro
        run: |
          mkdir -p app/src/main/res/values
          cp ../.github/patches/cyber_colors.xml app/src/main/res/values/cyber_colors.xml
      - name: Apply ChargeFlow adaptive icon
        working-directory: ChargeAnimPro
        run: |
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/values
          cp ../.github/patches/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp ../.github/patches/ic_monogram_foreground.xml app/src/main/res/drawable/ic_monogram_foreground.xml
          cp ../.github/patches/icon_background.xml app/src/main/res/values/icon_background.xml
      - name: Apply ChargeFlow app name
        working-directory: ChargeAnimPro
        run: |
          STRINGS="app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            if grep -q '<string name="app_name">' "$STRINGS"; then
              sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">ChargeFlow</string>#' "$STRINGS"
            else
              sed -i '/<resources>/a\\    <string name="app_name">ChargeFlow</string>' "$STRINGS"
            fi
          else
            mkdir -p app/src/main/res/values
            cat > "$STRINGS" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">ChargeFlow</string></resources>
          EOF
          fi
          sed -i 's#android:label="[^"]*"#android:label="@string/app_name"#' app/src/main/AndroidManifest.xml

      - name: Apply Cyberpunk tab names
        working-directory: ChargeAnimPro
        run: |
          STRINGS="app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's#<string name="app_tab_themes">[^<]*</string>#<string name="app_tab_themes">Skins</string>#' "$STRINGS"
            sed -i 's#<string name="app_tab_settings">[^<]*</string>#<string name="app_tab_settings">Config</string>#' "$STRINGS"
            sed -i 's#<string name="app_tab_preview">[^<]*</string>#<string name="app_tab_preview">Monitor</string>#' "$STRINGS"
            sed -i 's#<string name="app_tab_diagnostics">[^<]*</string>#<string name="app_tab_diagnostics">Telemetry</string>#' "$STRINGS"
          fi

      - name: Apply charging lifecycle preferences
        working-directory: ChargeAnimPro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/chargeanim/pro/data/PreferencesRepository.kt")
          s = p.read_text()
          if "enum class AnimationMode" not in s:
              s = s.replace(
                  "enum class MediaType",
                  'enum class AnimationMode { TEMPORARY, ALWAYS_ON }\n\nenum class MediaType',
                  1
              )
          if 'booleanPreferencesKey("enabled")' in s and 'stringPreferencesKey("animation_mode")' not in s:
              s = s.replace(
                  'val ENABLED = booleanPreferencesKey("enabled")',
                  'val ENABLED = booleanPreferencesKey("enabled")\n        val ANIMATION_MODE = stringPreferencesKey("animation_mode")',
                  1
              )
          if "val animationMode:" not in s:
              marker = "    val enabled: Flow<Boolean>"
              pos = s.find(marker)
              if pos >= 0:
                  line_end = s.find("\n", pos)
                  s = s[:line_end+1] + '    val animationMode: Flow<AnimationMode> = context.dataStore.data.map { prefs ->\n        runCatching { AnimationMode.valueOf(prefs[Keys.ANIMATION_MODE] ?: AnimationMode.TEMPORARY.name) }.getOrDefault(AnimationMode.TEMPORARY)\n    }\n' + s[line_end+1:]
          if "suspend fun setAnimationMode" not in s:
              marker = "    suspend fun setEnabled"
              pos = s.find(marker)
              if pos >= 0:
                  brace = s.find("\n    }", pos)
                  insert_at = brace + len("\n    }")
                  method = '''
    
    suspend fun setAnimationMode(mode: AnimationMode) {
        context.dataStore.edit { it[Keys.ANIMATION_MODE] = mode.name }
    }'''
                  s = s[:insert_at] + method + s[insert_at:]
          p.write_text(s)
          PY

      - name: Apply charging system overlay integration
        working-directory: ChargeAnimPro
        run: |
          cp ../.github/patches/ChargingService.kt app/src/main/java/com/chargeanim/pro/service/ChargingService.kt
          cp ../.github/patches/ChargingReceiver.kt app/src/main/java/com/chargeanim/pro/service/ChargingReceiver.kt
          cp ../.github/patches/EnergyRingVisual.kt app/src/main/java/com/chargeanim/pro/ui/theme/EnergyRingVisual.kt
          cp ../.github/patches/MediaColorAdapter.kt app/src/main/java/com/chargeanim/pro/media/MediaColorAdapter.kt
          cp ../.github/patches/VibesThemeManager.kt app/src/main/java/com/chargeanim/pro/ui/theme/VibesThemeManager.kt
          cp ../.github/patches/VibesTab.kt app/src/main/java/com/chargeanim/pro/ui/main/VibesTab.kt
          cp ../.github/patches/FlowingWaveView.kt app/src/main/java/com/chargeanim/pro/ui/overlay/FlowingWaveView.kt
          cp ../.github/patches/ChargeFlowSettings.kt app/src/main/java/com/chargeanim/pro/settings/ChargeFlowSettings.kt
          cp ../.github/patches/ChargingHistoryStore.kt app/src/main/java/com/chargeanim/pro/history/ChargingHistoryStore.kt
          cp ../.github/patches/ChargingAlertManager.kt app/src/main/java/com/chargeanim/pro/alert/ChargingAlertManager.kt
          cp ../.github/patches/ChargingOverlayScreen.kt app/src/main/java/com/chargeanim/pro/ui/overlay/ChargingOverlayScreen.kt
          mkdir -p app/src/main/java/com/chargeanim/pro/diagnostics
          cp ../.github/patches/DiagnosticLog.kt app/src/main/java/com/chargeanim/pro/diagnostics/DiagnosticLog.kt
          cp ../.github/patches/MainTabDashboard.kt app/src/main/java/com/chargeanim/pro/ui/main/MainTabDashboard.kt
          mkdir -p app/src/main/java/com/chargeanim/pro/telemetry
          cp ../.github/patches/ChargingMetrics.kt app/src/main/java/com/chargeanim/pro/telemetry/ChargingMetrics.kt
          cp ../.github/patches/ChargingMetricsProvider.kt app/src/main/java/com/chargeanim/pro/telemetry/ChargingMetricsProvider.kt
          python3 - <<'PY'
          from pathlib import Path
          s = Path("app/src/main/AndroidManifest.xml").read_text()
          for permission in [
              '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />']:
              if permission not in s: s = s.replace('<application', permission + "\n    <application", 1)
          if 'android:name=".service.ChargingService"' not in s:
              s = s.replace('</application>', '''    <service android:name=".service.ChargingService" android:enabled="true" android:exported="false" android:foregroundServiceType="specialUse" />\n          </application>''')
          if 'android:name=".service.ChargingReceiver"' not in s:
              s = s.replace('</application>', '''    <receiver android:name=".service.ChargingReceiver" android:enabled="true" android:exported="false">\n              <intent-filter>\n                  <action android:name="android.intent.action.ACTION_POWER_CONNECTED" />\n                  <action android:name="android.intent.action.ACTION_POWER_DISCONNECTED" />
                  <action android:name="android.intent.action.BOOT_COMPLETED" />
                  <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n              </intent-filter>\n          </receiver>\n          </application>''')
          # The source ZIP may contain the older receiver. Keep one authoritative power receiver.
          import re
          s = re.sub(r'\\s*<receiver[^>]*PowerConnectionReceiver[^>]*>.*?</receiver>', '', s, flags=re.S)
          Path("app/src/main/AndroidManifest.xml").write_text(s)
          PY
      - name: Centralize live charging metrics
        working-directory: ChargeAnimPro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          service = Path("app/src/main/java/com/chargeanim/pro/service/ChargingService.kt")
          s = service.read_text()
          s = s.replace('import kotlinx.coroutines.flow.combine', 'import kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.combine')
          s = s.replace('private lateinit var chargingMetrics: ChargingMetricsManager', 'private lateinit var chargingMetricsState: StateFlow<com.chargeanim.pro.telemetry.ChargingMetrics>')
          s = s.replace('chargingMetrics = ChargingMetricsManager(applicationContext)\n', 'chargingMetricsState = com.chargeanim.pro.telemetry.ChargingMetricsProvider.acquire(applicationContext)\n')
          s = s.replace('        chargingMetrics.start()\n', '')
          s = s.replace('chargingMetrics.state.collect', 'chargingMetricsState.collect')
          s = s.replace('        chargingMetrics.stop()\n', '        com.chargeanim.pro.telemetry.ChargingMetricsProvider.release()\n')
          s = s.replace('import com.chargeanim.pro.telemetry.ChargingMetricsManager\n', '')
          service.write_text(s)
          dashboard = Path("app/src/main/java/com/chargeanim/pro/ui/main/MainTabDashboard.kt")
          d = dashboard.read_text()
          d = d.replace('import com.chargeanim.pro.telemetry.ChargingMetricsManager\n', 'import com.chargeanim.pro.telemetry.ChargingMetricsProvider\n')
          d = d.replace('    val metricsManager = remember { ChargingMetricsManager(context.applicationContext) }\n    val metrics by metricsManager.state.collectAsStateWithLifecycle()\n\n    DisposableEffect(lifecycleOwner) {\n        metricsManager.start()\n        onDispose { metricsManager.stop() }\n    }', '    val metricsState = remember { ChargingMetricsProvider.acquire(context.applicationContext) }\n    val metrics by metricsState.collectAsStateWithLifecycle()\n\n    DisposableEffect(lifecycleOwner) {\n        onDispose { ChargingMetricsProvider.release() }\n    }')
          dashboard.write_text(d)
          PY
      - name: Provide missing launcher icon
        working-directory: ChargeAnimPro
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#08111F" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#12304A" android:pathData="M54,10A44,44 0,1 0,54 98A44,44 0,1 0,54 10" android:strokeColor="#2DDCFF" android:strokeWidth="3" android:fillType="evenOdd" />
              <path android:fillColor="#55E6FF" android:pathData="M59,12L30,57h23l-6,39 32,-50h-24z" />
              <path android:fillColor="#FFFFFF" android:pathData="M58,20L39,55h18l-3,23 15,-30h-17z" />
          </vector>
          EOF
          sed -i 's#@mipmap/ic_launcher#@drawable/ic_launcher#g' app/src/main/AndroidManifest.xml
      - name: Fix Compose compiler and source compatibility
        working-directory: ChargeAnimPro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("build.gradle")
          p.write_text(p.read_text().replace("    id 'org.jetbrains.kotlin.plugin.compose' version '1.9.24' apply false\n", ""))
          p = Path("app/build.gradle")
          s = p.read_text().replace("    id 'org.jetbrains.kotlin.plugin.compose'\n", "")
          marker = "    buildFeatures {\n        compose true\n    }"
          if "kotlinCompilerExtensionVersion" not in s: s = s.replace(marker, marker + "\n\n    composeOptions {\n        kotlinCompilerExtensionVersion '1.5.14'\n    }")
          dep = "    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'"
          if dep not in s: s = s.replace("dependencies {", "dependencies {\n" + dep, 1)
          icons = "    implementation 'androidx.compose.material:material-icons-extended:1.7.8'"
          if icons not in s: s = s.replace("dependencies {", "dependencies {\n" + icons, 1)
          palette = "    implementation 'androidx.palette:palette-ktx:1.0.0'"
          if palette not in s: s = s.replace("dependencies {", "dependencies {\n" + palette, 1)
          p.write_text(s)
          gp = Path("gradle.properties")
          gs = gp.read_text() if gp.exists() else ""
          gs = re.sub(r"(?m)^org\.gradle\.jvmargs=.*$", "", gs)
          gp.write_text(gs.strip() + "\norg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m\n")
          PY
      - name: Fix exact Kotlin source compile errors
        working-directory: ChargeAnimPro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              Path("app/src/main/java/com/chargeanim/pro/media/MediaRenderer.kt"),
              Path("app/src/main/java/com/chargeanim/pro/ui/overlay/ChargingOverlayActivity.kt"),
              Path("app/src/main/java/com/chargeanim/pro/ui/overlay/ChargingOverlayScreen.kt"),
              Path("app/src/main/java/com/chargeanim/pro/ui/theme/ChargeFlowThemes.kt"),
              Path("app/src/main/java/com/chargeanim/pro/ui/theme/EnergyRingVisual.kt"),
          ]
          for p in targets:
              if not p.exists():
                  continue
              s = p.read_text()
              if "import androidx.compose.runtime.getValue" not in s:
                  lines = s.splitlines()
                  idx = next((i for i, line in enumerate(lines) if line.startswith("import ")), len(lines))
                  lines[idx:idx] = ["import androidx.compose.runtime.getValue", "import androidx.compose.runtime.setValue"]
                  s = "\n".join(lines) + "\n"
              p.write_text(s)
          p = targets[0]
          s = p.read_text()
          if "import com.airbnb.lottie.compose.getValue" not in s:
              lines = s.splitlines()
              idx = next((i for i, line in enumerate(lines) if line.startswith("import ")), len(lines))
              lines.insert(idx, "import com.airbnb.lottie.compose.getValue")
              p.write_text("\n".join(lines) + "\n")
          PY
      - name: Enable AndroidX
        working-directory: ChargeAnimPro
        run: |
          touch gradle.properties
          if grep -q '^android.useAndroidX=' gradle.properties; then sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties; else echo 'android.useAndroidX=true' >> gradle.properties; fi
          if grep -q '^android.enableJetifier=' gradle.properties; then sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties; else echo 'android.enableJetifier=true' >> gradle.properties; fi
      - name: Generate wrapper
        working-directory: ChargeAnimPro
        run: gradle wrapper --gradle-version 8.7
      - name: Inspect final charging integration
        working-directory: ChargeAnimPro
        run: |
          echo "=== Charging integration files ==="
          grep -R "ACTION_POWER_CONNECTED\\|ChargingService\\|ChargingReceiver" app/src/main/java app/src/main/AndroidManifest.xml || true
          echo "=== Manifest receivers/services ==="
          grep -n "<receiver\\|<service\\|SYSTEM_ALERT_WINDOW\\|FOREGROUND_SERVICE" app/src/main/AndroidManifest.xml || true
      - name: Build debug APK
        working-directory: ChargeAnimPro
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          test -s ChargeAnimPro/app/build/outputs/apk/debug/app-debug.apk
          unzip -l ChargeAnimPro/app/build/outputs/apk/debug/app-debug.apk | grep -q 'AndroidManifest.xml'
          echo "APK created successfully."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChargeFlow-debug-apk
          path: ChargeAnimPro/app/build/outputs/apk/debug/app-debug.apk
