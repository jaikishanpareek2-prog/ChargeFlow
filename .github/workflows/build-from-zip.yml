name: Build ChargeFlow APK

on:
  push:
    branches: [ main ]
    paths:
      - 'ChargeAnimPro.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          rm -rf ChargeAnimPro
          unzip -q ChargeAnimPro.zip
          test -f ChargeAnimPro/settings.gradle
          test -f ChargeAnimPro/app/src/main/AndroidManifest.xml

      - name: Provide missing launcher icon
        working-directory: ChargeAnimPro
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#08111F"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#12304A"
                  android:pathData="M54,10A44,44 0,1 0,54 98A44,44 0,1 0,54 10"
                  android:strokeColor="#2DDCFF"
                  android:strokeWidth="3"
                  android:fillType="evenOdd" />
              <path
                  android:fillColor="#55E6FF"
                  android:pathData="M59,12L30,57h23l-6,39 32,-50h-24z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M58,20L39,55h18l-3,23 15,-30h-17z" />
          </vector>
          EOF
          sed -i 's#@mipmap/ic_launcher#@drawable/ic_launcher#g' app/src/main/AndroidManifest.xml
          grep -n 'android:icon' app/src/main/AndroidManifest.xml

      - name: Fix Compose compiler configuration
        working-directory: ChargeAnimPro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          s = p.read_text()
          s = s.replace("    id 'org.jetbrains.kotlin.plugin.compose' version '1.9.24' apply false\n", "")
          p.write_text(s)

          p = Path("app/build.gradle")
          s = p.read_text()
          s = s.replace("    id 'org.jetbrains.kotlin.plugin.compose'\n", "")
          marker = "    buildFeatures {\n        compose true\n    }"
          replacement = marker + "\n\n    composeOptions {\n        kotlinCompilerExtensionVersion '1.5.14'\n    }"
          if "kotlinCompilerExtensionVersion" not in s:
              s = s.replace(marker, replacement)
          p.write_text(s)
          PY
          grep -n "compose\|kotlinCompilerExtensionVersion" build.gradle app/build.gradle

      - name: Enable AndroidX
        working-directory: ChargeAnimPro
        run: |
          touch gradle.properties
          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi
          if grep -q '^android.enableJetifier=' gradle.properties; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

      - name: Generate wrapper
        working-directory: ChargeAnimPro
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: ChargeAnimPro
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f ChargeAnimPro/app/build/outputs/apk/debug/app-debug.apk
          unzip -l ChargeAnimPro/app/build/outputs/apk/debug/app-debug.apk | grep -q 'AndroidManifest.xml'
          echo "APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChargeFlow-debug-apk
          path: ChargeAnimPro/app/build/outputs/apk/debug/app-debug.apk
